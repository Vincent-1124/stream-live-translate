[audio]
mode = "system"             # "system" = 系统音频环回；"device" = 选指定设备；
                            # "obs_filter" = 由 OBS 插件的"实时字幕捕获"滤镜送音频（插件模式下自动设置）
use_screen_capture_kit = true
device = ""                 # mode=system 时留空
sample_rate = 16000         # 内部管线采样率（8000–384000）。必须显式填写：0/1 等非法值会被服务端拒绝
channels = 1
ingest_port = 8788          # obs_filter 模式下接收 OBS 滤镜音频的本地 TCP 端口；0 = 禁用

[filter]
silence_rms = 0.012
music_spectral_flatness = 0.55
min_segment_ms = 350
max_segment_ms = 8000

[obs]
auto_connect = true
host = "127.0.0.1"
port = 4455
password = ""               # 如果 OBS ws 启用了鉴权
register_dock = true

[overlay]
font_family = "Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"
font_size = 48
font_color = "#FFFFFF"
background_color = "#000000"
background_opacity = 0.55
bg_opacity = 75              # 背景不透明度 0-100（0=全透明，100=全黑）
bg_width = 0                 # 背景宽度 px，0 = 自动贴合文字
bg_height = 0                # 背景高度 px，0 = 自动（按行数自适应）
border_radius = 8            # 背景圆角 px
max_lines = 2                # 字幕最大行数（可设 1–4）：超出的部分换到下一页显示，不做滚动；1 = 严格单行 + 省略号
display_delay_ms = 750       # 新字幕页的显示缓冲（毫秒，500–1000）
clear_after_ms = 4000        # 最后一条字幕事件后自动清屏的时长（毫秒，1000–15000）
position = "bottom"          # bottom | top | middle
layout = "single"            # single | double
animation = "typewriter"     # typewriter | fade | slide
mirror_to_text_source = false

[audio_test]
quiet_ms = 3000              # 引导试音：先采集多少毫秒安静背景（1000–30000）
speech_ms = 10000            # 引导试音：再采集多少毫秒讲话（1000–30000）

# 本场字幕记录（P1-06 / P2-07）
# auto_persist = true  —— 识别完成的句子自动追加写入本场 JSONL 记录文件。
#                        改成 false 只停止写入，**不会**删除磁盘上已有的记录。
# retention_days = 0   —— 0 = 永久保留。设成 N 则在启动时删除 N 天前的历史记录文件
#                        （当前这场永远不会被删）。默认 0，避免默认删证据。
auto_persist = true
retention_days = 0
