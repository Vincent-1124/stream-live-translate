# Stream Live Translate 默认配置
# 复制到可执行文件同目录即可。第一次启动会自己创建。
# 大多数用户只需要填 [llm] 段的 api_key。

[server]
host = "127.0.0.1"
port = 8787
static_dir = "dist"   # 启动器所在目录下的 dist/ 子目录；绝对路径也行

[llm]
provider = "bailian-fun-asr"
api_key = ""          # <-- 在这里填你自己的 DashScope / OpenAI Key
model = "fun-asr-realtime"
endpoint = ""         # 留空 = 用内置地址
target_lang = "zh"
translate_chinese = false   # true 的话中文也会被"翻译"（一般不必要）
system_prompt = ""
segment_ms = 0    # 低延迟分段(毫秒)：0=整句模式；800~1600=字幕边说边出，中文直播建议配 qwen3-asr-flash-realtime
transcribe = false          # 实时字幕模式（GLM/OpenAI 通道）：只显示说话人语音转写，忽略模型回复
transcription_model = ""    # 转写子模型：留空自动（OpenAI 官方默认 gpt-4o-mini-transcribe；GLM 通常不用填）
gateway_text = false        # 本机网关模式（local 通道）：网关返回的 response.text 直接当字幕（如 huggingface/speech-to-speech）
workspace_id = ""           # 可选：百炼业务空间 ID；填后自动使用北京专属域名
speech_noise_threshold = 0.0 # 云端语音/噪音判定阈值，范围 -1.0~1.0。越高越能压掉环境噪声，
                             # 但可能把主讲人的话也判成噪声、并让断句更碎。只对 bailian-fun-asr 生效；
                             # 随 run-task 下发，改它需要重启识别会话（管理页保存后会自动重启）。
                             # 管理页「过滤预设」会同时设置它和 [filter] silence_rms。
semantic_punctuation_enabled = true
# 热词表（R10）：仅 bailian-fun-asr 使用，经官方"上下文增强"（input.context）下发。
# 生效机制是词表匹配：这里必须写音频里会出现的**原词**，只写语义描述无效。
# 建议：含非 ASCII 字符的单条不超过 15 字符；纯英文按空格不超过 7 个片段。
