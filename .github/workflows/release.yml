name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: every job gets a read-only token unless it
# explicitly asks for more. Only the `release` job below publishes, and it is
# the only place that grants `contents: write`.
#
# Actions are pinned to verified full commit SHAs; the trailing comment keeps
# the corresponding human-readable upstream version visible to reviewers.
permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Cargo, plugin, asset and tag versions
        shell: bash
        run: bash scripts/sync-version.sh --tag "$GITHUB_REF_NAME"

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-23
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/x86_64-pc-windows-msvc/release/stream-live-translate.exe artifacts/
          cd artifacts
          powershell -Command "Compress-Archive -Path 'stream-live-translate.exe' -DestinationPath 'stream-live-translate-windows-x86_64.zip'"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: artifacts/stream-live-translate-windows-x86_64.zip

  build-macos:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-23
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/x86_64-apple-darwin/release/stream-live-translate artifacts/stream-live-translate-x86_64
          cp target/aarch64-apple-darwin/release/stream-live-translate artifacts/stream-live-translate-aarch64
          cd artifacts
          tar -czvf stream-live-translate-macos.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: artifacts/stream-live-translate-macos.tar.gz

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-23
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/stream-live-translate artifacts/
          cd artifacts
          tar -czvf stream-live-translate-linux-x86_64.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: artifacts/stream-live-translate-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # The only job that writes to the repository: it creates the GitHub
    # Release. Everything else in this workflow stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Verify downloaded artifact checksums
        shell: bash
        # The three build jobs above produce bare binaries/archives, not
        # `.sha256` sidecars, so there is normally nothing to verify here.
        # This step therefore verifies whatever sidecars exist and *reports*
        # how many artifacts had none, instead of pretending to have checked
        # them. (plugin.yml, whose packaging script does emit sidecars, fails
        # hard when there is nothing to verify.)
        run: |
          set -euo pipefail
          verified=0
          unverified=0
          for sumfile in $(find artifacts -type f -name '*.sha256' | sort); do
            echo "== verifying $sumfile"
            ( cd "$(dirname "$sumfile")" && sha256sum -c "$(basename "$sumfile")" )
            verified=$((verified + 1))
          done
          for artifact in $(find artifacts -type f | sort); do
            case "$artifact" in
              *.sha256) continue ;;
            esac
            if [ -f "$artifact.sha256" ]; then continue; fi
            echo "::notice::$artifact has no .sha256 sidecar; recorded in the manifest only"
            unverified=$((unverified + 1))
          done
          echo "verified=$verified unverified(no sidecar)=$unverified"

      - name: Create release manifest (name, size, SHA-256)
        shell: bash
        # Records byte size + SHA-256 for every file about to be published in
        # artifacts/tools/release-manifest.json, plus a flat
        # `sha256sum -c`-compatible list in artifacts/tools/SHA256SUMS. Both
        # live under artifacts/ so the existing upload globs pick them up.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"   # v1.2.3 -> 1.2.3 (matches CARGO_PKG_VERSION)

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "::error::no downloaded artifacts to manifest; nothing to release"
            exit 1
          fi

          mkdir -p artifacts/tools
          {
            printf '{\n'
            printf '  "tag": "%s",\n' "$GITHUB_REF_NAME"
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "generated_by": "release.yml",\n'
            printf '  "files": [\n'
            first=1
            for artifact in $(find artifacts -type f | sort); do
              case "$artifact" in
                artifacts/tools/*) continue ;;
              esac
              size=$(stat -c '%s' "$artifact")
              hash=$(sha256sum "$artifact" | cut -d' ' -f1)
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              printf '    { "file": "%s", "bytes": %s, "sha256": "%s" }' "${artifact#artifacts/}" "$size" "$hash"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > artifacts/tools/release-manifest.json

          ( cd artifacts && find . -type f ! -path './tools/*' -print0 \
              | sort -z | xargs -0 sha256sum ) > artifacts/tools/SHA256SUMS

          echo "== release manifest"
          cat artifacts/tools/release-manifest.json
          echo "== SHA256SUMS"
          cat artifacts/tools/SHA256SUMS

      - name: Secret / template guard
        shell: bash
        # Release gate. Refuses to publish when the tree or the built packages
        # contain credentials or an unedited template. The pattern list and the
        # per-pattern rationale live in scripts/ci-secret-guard.sh so both
        # workflows run exactly the same checks.
        run: bash scripts/ci-secret-guard.sh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
            artifacts/tools/*
