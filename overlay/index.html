<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Live Subtitle Overlay</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/overlay-assets/style.css?v=0.0.28" />
</head>
<body class="position-bottom layout-single animation-typewriter">
  <div id="stage" aria-live="polite">
    <div id="caption" class="caption empty">
      <span id="caption-line" class="caption-line"></span>
      <span id="caption-cursor" class="caption-cursor"></span>
    </div>
  </div>
  <!-- The server replaces __SLT_TOKEN__ with the caller's own access token
       (empty for an anonymous request). The overlay URL normally carries the
       read-only token as ?token=..., which this global mirrors. -->
  <script>window.__SLT_TOKEN__ = "__SLT_TOKEN__";</script>
  <script src="/overlay-assets/app.js?v=0.0.28"></script>
</body>
</html>
